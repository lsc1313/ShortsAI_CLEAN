name: ShortsAI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop
      - 'feat/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check modules/createShort.js
      - run: node --check modules/hotdeal/director.js
      - run: node --check modules/hotdeal/card.js
      - run: node --test tests/hotdealStory.test.js
      - run: node --check automation/masterScheduler.js
      - run: node --check modules/kakaoCurator/store.js
      - run: node --check modules/kakaoCurator/media.js
      - run: node --check modules/shopping/productMedia.js
      - run: node --check modules/shopping/director.js
      - run: node --check modules/metadata.js
      - run: node --check public/app.js
      - run: node --test tests/kakaoCurator.test.js tests/shoppingProductMedia.test.js tests/shoppingQualityFix.test.js tests/curatorUpload.test.js
      - run: node --check modules/video/render.js
      - run: node --check modules/video.js
      - run: node --check modules/threads/director.js
      - run: node --check brain/manager.js
