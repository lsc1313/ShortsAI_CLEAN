name: ShortsAI CI

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node --check server.js
      - run: node --check modules/createShort.js
      - run: node --check modules/hotdeal/director.js
      - run: node --check modules/hotdeal/card.js
      - run: node --test tests/hotdealStory.test.js
