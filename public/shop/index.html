.page {

.header {

    margin-bottom:26px;

.header h1 {

.header p {

.notice {

    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:12px;
    font-size:12px;
    line-height:1.6;
    color:#666;
}

.product-card {
    position:relative;
    overflow:hidden;
    margin:0 0 22px;
    background:#fff;
    border:1px solid #e8e8e8;
    border-radius:18px;
    box-shadow:
        0 3px 12px

}

.latest-badge {
    position:absolute;
    z-index:2;
    top:12px;
    left:12px;
    padding:7px 10px;
    border-radius:999px;
    background:#111;
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.image-link {
    display:block;
    text-decoration:none;
}

.product-card img {
    display:block;
    width:100%;
    max-height:430px;
    object-fit:contain;
    background:#fff;
}

.no-image {
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:240px;
    background:#eee;
    color:#888;
}

.product-body {
    padding:18px;
}

.product-body h2 {
    margin:0 0 16px;
    font-size:18px;
    line-height:1.55;
}

.product-button {
    display:block;
    width:100%;
    padding:15px 16px;
    border-radius:12px;
    background:#111;
    color:#fff;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:700;
}

.empty {
    padding:50px 20px;
    background:#fff;
    border-radius:16px;
    text-align:center;
    color:#777;
}

.footer {
    margin-top:30px;
