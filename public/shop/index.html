<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>영상 속 상품 모아보기</title>
<style>
* { box-sizing:border-box; }
body { margin:0; background:#f7f7f7; color:#181818; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.page { width:100%; max-width:640px; margin:0 auto; padding:26px 16px 44px; }
.header { text-align:center; margin-bottom:20px; }
.header h1 { margin:0 0 8px; font-size:26px; font-weight:800; }
.header p { margin:0; color:#777; font-size:14px; }
.notice { margin:0 0 20px; padding:12px; background:#fff; border:1px solid #e4e4e4; border-radius:12px; color:#666; font-size:11px; }

.tab-container { display:flex; gap:8px; margin-bottom:20px; }
.tab-btn { flex:1; padding:12px 0; border:1px solid #ddd; border-radius:10px; background:#fff; color:#555; font-weight:700; font-size:14px; cursor:pointer; text-align:center; }
.tab-btn.active { background:#292929; color:#fff; border-color:#292929; }
.tab-content { display:none; }
.tab-content.active { display:grid; }

.product-grid { grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
.product-card { position:relative; display:block; background:#fff; border:1px solid #e7e7e7; border-radius:14px; text-decoration:none; color:#181818; overflow:hidden; }
.latest-badge { position:absolute; top:6px; left:6px; padding:4px 6px; background:#292929; border-radius:6px; color:#fff; font-size:10px; font-weight:700; }
.product-image { display:flex; align-items:center; justify-content:center; width:100%; aspect-ratio:1/1; }
.product-image img { width:100%; height:100%; object-fit:contain; padding:4px; }
.product-name { min-height:50px; padding:8px; border-top:1px solid #f1f1f1; font-size:12px; font-weight:700; line-height:1.3; word-break:keep-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.footer { margin-top:30px; color:#999; text-align:center; font-size:11px; }
</style>
</head>
<body>
<main class="page">
    <header class="header">
        <h1>영상 속 상품 모아보기</h1>
        <p>영상에서 소개한 상품을 빠르게 확인하세요.</p>
    </header>
    <div class="notice">※ 이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>

    <div class="tab-container">
        <button id="btn-hotdeal" class="tab-btn active" onclick="switchTab('hotdeal')">🔥 오늘의 핫딜</button>
        <button id="btn-all" class="tab-btn" onclick="switchTab('all')">📦 전체 상품</button>
    </div>

    <!-- HOTDEAL_START -->
<section id="hotdeal-section" class="product-grid tab-content active">
<a class="product-card" href="https://link.coupang.com/a/sample1" target="_blank" rel="nofollow sponsored">
        <span class="latest-badge">오늘의 핫딜</span>
        <div class="product-image">
            <img src="https://thumbnail7.coupangcdn.com/thumbnails/remote/492x492ex/image/retail/images/2023/10/24/11/4/2f8bbfdf-ceef-4015-8f6b-ef6268bd1e0d.jpg" alt="키친타월 100% 천연펄프 무형광 5000매" loading="lazy">
        </div>
        <div class="product-name">키친타월 100% 천연펄프 무형광 5000매</div>
    </a>
</section>
<!-- HOTDEAL_END -->

    <!-- ALL_START -->
    <section id="all-section" class="product-grid tab-content">
    </section>
    <!-- ALL_END -->

    <footer class="footer">상품의 가격, 옵션, 구성, 재고, 할인 및 배송 정보는 판매 페이지에서 확인할 수 있습니다.</footer>
</main>

<script>
function switchTab(tab) {
    document.getElementById("btn-hotdeal").classList.toggle("active", tab === "hotdeal");
    document.getElementById("btn-all").classList.toggle("active", tab === "all");
    document.getElementById("hotdeal-section").classList.toggle("active", tab === "hotdeal");
    document.getElementById("all-section").classList.toggle("active", tab === "all");
}
</script>
</body>
</html>
