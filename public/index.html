<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShortsAI Studio</title>

<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="container">

    <h1 class="mainTitle">
        🤖 ShortsAI Studio
    </h1>

<!-- PC MASTER SCHEDULER STATUS -->
<div id="schedulerPanel" class="schedulerPanel">

    <div class="schedulerHeader">
        <strong>🖥️ PC 자동화</strong>
        <span id="schedulerOverall">확인 중...</span>
    </div>

    <div id="schedulerJobs">
        자동화 상태를 불러오는 중입니다.
    </div>

    <div id="schedulerError"></div>

</div>

    <!-- 빠른 생성 -->

    <div class="card">

        <h3 class="quickTitle">
            📝 빠른 생성
        </h3>

        <input
            id="topic"
            class="quickInput"
            placeholder="만들고 싶은 주제를 입력하세요">

<div class="quickButtons">
    <button
        class="quickCreateBtn"
        onclick="createShorts()">
        🚀 생성
    </button>
</div>

<div id="result" class="resultBox"></div>

    </div>

	
    <!-- Brain -->

    <!-- COUPANG PRODUCT MANAGEMENT REMOVED -->

<div class="card">

        <h3 class="brainTitle">
            🤖 Brain 자동 제작
        </h3>

        <div id="brainShoppingProduct">
            <label for="brainShoppingProductName">
                쇼핑 상품명
            </label>

            <input
                id="brainShoppingProductName"
                type="text"
                placeholder="제작할 상품명을 입력하세요"
                autocomplete="off">

            <button
                id="brainShoppingCreateBtn"
                type="button"
                onclick="createShoppingByProductName()">
                🛒 쇼핑 제작
            </button>
        </div>

        <h3>카테고리</h3>

        <div class="categoryRow">

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="shopping">
                    
                쇼핑
            </label>

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="history"
                    checked>
                역사
            </label>

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="animal"
                    checked>
                동물
            </label>

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="ai"
                    checked>
                AI
            </label>

	    <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="science"
                    checked>
                과학
            </label>

        </div>


<div class="countRow">

    <label for="brainContentType">
        &#51228;&#51089; &#54805;&#49885;
    </label>

    <select
        id="brainContentType"
        onchange="syncBrainContentType()">

        <option value="SHORTS">
            SHORTS
        </option>

        <option value="LONGFORM">
            LONGFORM
        </option>

    </select>

</div>

<div class="countRow">

    <label for="brainCount">
        제작 개수
    </label>

    <input
        id="brainCount"
        type="number"
        value="20"
        min="1"
        max="100">

</div>

        <div class="brainButtons">

            <button id="startBtn" onclick="startBrain()">
                ▶ 실행
            </button>

            <button id="stopBtn" onclick="stopBrain()">
                ⏸ 정지
            </button>

            <button id="cancelBtn" onclick="cancelBrain()">
                ⛔ 취소
            </button>

        </div>

<div id="brainProgress">
    <div id="brainProgressBar"></div>
</div>

<div id="brainProgressText">
    0 / 0 (대기)
</div>

        <br>

        <strong>현재 작업</strong>

        <div id="brainCurrent">

            현재 작업 없음

        </div>

        <br>

<div class="logCard">

<strong>📋 작업 로그</strong>

<div id="brainList"></div>

</div>

    </div>

</div>




<section id="curatorPanel" style="margin:20px 0;padding:20px;color:#fff;background:#19202b;border-radius:16px;">
  <h2 style="margin:0 0 12px">🎁 카카오 선물하기 큐레이터</h2>
  <p>쿠팡 파트너스 1개(12:00) + 큐레이터 1개(18:00)를 매일 자동 제작합니다. 큐레이터 링크는 카카오에서 발급한 원본 링크만 등록하세요.</p>
  <form id="curatorForm" style="display:flex;flex-direction:column;gap:10px;">
    <input id="curatorName" required placeholder="선물하기 상품명" style="padding:12px;border-radius:8px;">
    <input id="curatorLink" type="url" required placeholder="https://gift-link.kakao.com/c/..." style="padding:12px;border-radius:8px;">
    <textarea id="curatorImages" rows="2" placeholder="실제 상품 이미지 https 주소 (한 줄에 하나씩, 선택)" style="padding:12px;border-radius:8px;"></textarea>
    <button type="submit" style="padding:12px;border-radius:8px;">큐레이터 상품 등록</button>
  </form>
  <p id="curatorStatus" aria-live="polite">상품 이미지를 확보해야 영상이 제작됩니다. 이미지가 없으면 공개 페이지에서 가져오기를 시도합니다.</p>
  <div id="curatorList" style="display:flex;flex-direction:column;gap:10px;"></div>
</section>

<script src="/app.js"></script>
</body>

</html>
