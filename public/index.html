<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShortsAI Studio</title>

<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="container">

    <h1 class="mainTitle">
        🤖 ShortsAI Studio
    </h1>

    <!-- 빠른 생성 -->

    <div class="card">

        <h3 class="quickTitle">
            📝 빠른 생성
        </h3>

        <input
            id="topic"
            class="quickInput"
            placeholder="만들고 싶은 주제를 입력하세요">

<div class="quickButtons">
    <button
        class="quickCreateBtn"
        onclick="createShorts()">
        🚀 생성
    </button>
</div>

<div id="result" class="resultBox"></div>

    </div>

	    <!-- Brain -->

    <!-- COUPANG PRODUCT MANAGEMENT -->

    <div class="card" id="coupangProductCard">

        <h3 class="coupangTitle">
            🛒 쿠팡 상품 관리
        </h3>

        <div class="coupangForm">

            <label for="coupangName">
                상품명
            </label>

            <input
                id="coupangName"
                type="text"
                placeholder="쿠팡 상품명을 입력하세요"
                autocomplete="off">


            <label for="coupangPartnerUrl">
                쿠팡 파트너스 링크
            </label>

            <input
                id="coupangPartnerUrl"
                type="url"
                placeholder="https://link.coupang.com/...">


            <label for="coupangImages">
                상품 사진
            </label>

            <input
                id="coupangImages"
                class="coupangFileInput"
                type="file"
                accept="image/*"
                multiple>


            <div class="coupangImageHelp">
                휴대폰 갤러리에서 상품 사진을 여러 장 선택하세요.
            </div>


            <div
                id="coupangImagePreview"
                class="coupangImagePreview">
            </div>


            <button
                id="coupangAddBtn"
                type="button"
                onclick="addCoupangProduct()">
                📦 상품 등록
            </button>


            <div
                id="coupangMessage"
                class="coupangMessage">
            </div>

        </div>


        <div class="coupangDivider"></div>


        <div class="coupangListHeader">

            <strong>
                등록 상품
            </strong>

            <button
                type="button"
                class="coupangRefreshBtn"
                onclick="loadCoupangProducts()">
                새로고침
            </button>

        </div>


        <div
            id="coupangProductList"
            class="coupangProductList">
            상품 목록 불러오는 중...
        </div>

    </div>




    <div class="card">

        <h3 class="brainTitle">
            🤖 Brain 자동 제작
        </h3>

        <h3>카테고리</h3>

        <div class="categoryRow">

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="shopping">
                    
                쇼핑
            </label>

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="history"
                    checked>
                역사
            </label>

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="animal"
                    checked>
                동물
            </label>

            <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="ai"
                    checked>
                AI
            </label>

	    <label>
                <input type="checkbox"
                    class="brainCategory"
                    value="science"
                    checked>
                과학
            </label>

        </div>

<div class="countRow">

    <label for="brainCount">
        제작 개수
    </label>

    <input
        id="brainCount"
        type="number"
        value="20"
        min="1"
        max="100">

</div>

        <div class="brainButtons">

            <button id="startBtn" onclick="startBrain()">
                ▶ 실행
            </button>

            <button id="stopBtn" onclick="stopBrain()">
                ⏸ 정지
            </button>

            <button id="cancelBtn" onclick="cancelBrain()">
                ⛔ 취소
            </button>

        </div>

<div id="brainProgress">
    <div id="brainProgressBar"></div>
</div>

<div id="brainProgressText">
    0 / 0 (대기)
</div>

        <br>

        <strong>현재 작업</strong>

        <div id="brainCurrent">

            현재 작업 없음

        </div>

        <br>

<div class="logCard">

<strong>📋 작업 로그</strong>

<div id="brainList"></div>

</div>

    </div>

</div>

<script src="/app.js"></script>

</body>

</html>
